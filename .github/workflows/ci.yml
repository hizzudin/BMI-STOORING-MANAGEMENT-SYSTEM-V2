# Design D-06: every pull request runs the whole gate. The services replace the local WSL ones.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Throwaway values of the CI service container, not a secret.
      TEST_DATABASE_URL: postgres://bmi:bmi_ci@localhost:5432/bmi_dev
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmi
          POSTGRES_PASSWORD: bmi_ci
          POSTGRES_DB: bmi_dev
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PRD coverage and named tests
        run: pnpm check:coverage
      - name: Secret scan
        run: pnpm check:secrets
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Generated client is up to date
        run: pnpm check:client
      - name: Layer rules
        run: pnpm check:layers
      - name: Unit and integration tests with coverage gates
        run: pnpm test:coverage
      - name: Install the E2E browser
        run: pnpm --filter @bmi/web exec playwright install --with-deps chromium --only-shell
      - name: E2E
        run: pnpm e2e
      - name: Keep the E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
