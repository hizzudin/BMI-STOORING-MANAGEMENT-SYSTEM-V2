# Design D-06: every pull request runs the whole gate. The services replace the local WSL ones.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Throwaway values of the CI service container, not a secret.
      TEST_DATABASE_URL: postgres://bmi:bmi_ci@localhost:5432/bmi_dev
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: 1
      # DEC-135: the S3 run of the storage contract suite against MinIO (throwaway CI values).
      R2_ENDPOINT: http://localhost:9000
      R2_BUCKET: bmi-ci
      R2_ACCESS_KEY_ID: bmi-ci-minio
      R2_SECRET_ACCESS_KEY: bmi-ci-minio-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmi
          POSTGRES_PASSWORD: bmi_ci
          POSTGRES_DB: bmi_dev
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PRD coverage and named tests
        run: pnpm check:coverage
      - name: Secret scan
        run: pnpm check:secrets
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Generated client is up to date
        run: pnpm check:client
      - name: Layer rules
        run: pnpm check:layers
      - name: MinIO for the S3 storage contract (DEC-135)
        # The official binary of one pinned release, checked against its published SHA-256; the
        # Docker Hub image is no longer published.
        run: |
          base=https://dl.min.io/server/minio/release/linux-amd64/archive
          release=minio.RELEASE.2025-04-22T22-12-26Z
          curl -sfL -o "$RUNNER_TEMP/$release" "$base/$release"
          curl -sfL -o "$RUNNER_TEMP/$release.sha256sum" "$base/$release.sha256sum"
          (cd "$RUNNER_TEMP" && sha256sum -c "$release.sha256sum")
          chmod +x "$RUNNER_TEMP/$release"
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER="$R2_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$R2_SECRET_ACCESS_KEY" \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/minio-data" --address :9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - name: Unit and integration tests with coverage gates
        run: pnpm test:coverage
      # ADR-0003, DEC-130: the local trial seed must follow every migration.
      - name: Local trial seed follows the migrations
        run: node apps/api/dist/infra/db/trial/trial-cli.js --reset
        env:
          TRIAL_DATABASE_URL: postgres://bmi:bmi_ci@localhost:5432/bmi_trial
      - name: Install the E2E browser
        run: pnpm --filter @bmi/web exec playwright install --with-deps chromium --only-shell
      - name: E2E
        run: pnpm e2e
      - name: Keep the E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
