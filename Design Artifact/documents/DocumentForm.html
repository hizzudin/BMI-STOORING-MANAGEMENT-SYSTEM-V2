<head>

<title>Document form · BMI Stooring System</title>

<body data-nav="documents" data-roles="System Admin:manage" data-root="../">
<main class="stage">
<div class="screen"><div class="head"><div class="crumb">Documents / New</div><h1>Add document</h1><span class="grow"></span><button class="btn " type="button">Cancel</button><button class="btn pri" data-act="manage" type="button">Save</button></div>
      <section class="variant" id="AddDocument" data-label="First entry, outside an SPK"><div class="grid g2"><div class="card white"><h3><span class="circle-ic"><i data-i="documents"></i></span>Document<span class="grow"></span></h3><div class="grid ge"><div class="field"><label>Vehicle</label><input class="input" value="B 7710 TR"></div><div class="field"><label>Type</label><select class="input"><option>Insurance</option><option>STNK</option><option>KIR</option></select></div><div class="field"><label>Number</label><input class="input" value=""></div><div class="field"><label>Valid until</label><input class="input" value=""></div></div></div><div class="card "><h3><span class="circle-ic"><i data-i="upload"></i></span>Scan<span class="grow"></span></h3><div class="drop"><i data-i="upload"></i> Drop a photo or PDF</div></div></div></section>
      <section class="variant" id="DocumentCorrectEntry" data-label="Correct entry before the first renewal SPK"><div class="note "><i data-i="edit"></i><div>Status is recalculated from the corrected dates; the change is audited.</div></div><div class="bar"><button class="btn pri" data-act="manage" type="button">Save correction</button></div></section></div>
</main>
