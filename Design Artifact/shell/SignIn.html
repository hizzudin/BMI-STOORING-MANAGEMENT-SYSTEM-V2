<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · BMI Stooring System</title>
<link rel="stylesheet" href="../_kit/bmi.css">
<script src="../_kit/kit.js"></script>
</head>
<body data-nav="none" data-roles="" data-root="../">
<main class="stage">
<div class="screen" style="max-width:980px;margin:40px auto;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center">
      <div style="text-align:center"><span style="display:inline-grid;place-items:center;width:200px;height:200px;border-radius:50%;background:var(--mist-light)"><img src="../_kit/bmi-logo.png" alt="BMI" style="width:150px;mix-blend-mode:multiply"></span>
        <h1 style="margin:18px 0 4px">BMI Stooring System</h1><p class="muted">No maintenance without an approved Surat Perintah Kerja.</p></div>
      <div>
      <section class="variant" id="WebLogin" data-label="Sign in (web and mobile use the same form)"><div class="field"><label>Email</label><input class="input" value="budi.s@bmi.co.id"></div><div class="field"><label>Password</label><input class="input" value="••••••••"></div>
        <div class="note "><i data-i="lock"></i><div>After 5 failed sign-ins the account locks for 15 minutes; an Access Manager can unlock it.</div></div><div class="bar"><button class="btn pri" type="button">Sign in</button></div></section>
      <hr class="rule">
      <section class="variant" id="ChangePassword" data-label="First sign-in: choose a new password"><div class="field"><label>New password</label><input class="input" value=""></div><div class="field"><label>Repeat new password</label><input class="input" value=""></div>
        <p class="small muted">At least 8 characters with letters and digits.</p><div class="bar"><button class="btn pri" type="button">Save and continue</button></div></section>
      <hr class="rule">
      
      </div></div>
</main>
</body>
</html>
