 d="M233 501 h12"></path><path class="m-tread" d="M233 507 h12"></path><text x="239" y="484" class="m-code" transform="rotate(-90 239 484)">A6_RO</text></g><g class="m-tyre t-miss" data-code="SP1"><title>SP1, Spare 1, Missing</title><circle cx="120" cy="145" r="21"></circle><circle class="m-hub" cx="120" cy="145" r="11"></circle><text x="120" y="148" class="m-code">SP1</text><text x="120" y="164" class="m-miss m-miss-small">?</text></g><g class="m-tyre t-ok" data-code="SP2"><title>SP2, Spare 2, Normal</title><circle cx="180" cy="145" r="21"></circle><circle class="m-hub" cx="180" cy="145" r="11"></circle><text x="180" y="148" class="m-code">SP2</text></g><circle class="m-hubcap" cx="104" cy="70" r="6"></circle><circle class="m-hubcap" cx="196" cy="70" r="6"></circle><circle class="m-hubcap" cx="104" cy="220" r="6"></circle><circle class="m-hubcap" cx="196" cy="220" r="6"></circle><circle class="m-hubcap" cx="104" cy="286" r="6"></circle><circle class="m-hubcap" cx="196" cy="286" r="6"></circle><circle class="m-hubcap" cx="104" cy="352" r="6"></circle><circle class="m-hubcap" cx="196" cy="352" r="6"></circle><circle class="m-hubcap" cx="104" cy="418" r="6"></circle><circle class="m-hubcap" cx="196" cy="418" r="6"></circle><circle class="m-hubcap" cx="104" cy="484" r="6"></circle><circle class="m-hubcap" cx="196" cy="484" r="6"></circle></svg>