<svg xmlns="http://www.w3.org/2000/svg" class="chassis" viewBox="0 0 300 432" role="img" aria-label="Chassis map, 4 axles"><style>/* @bmi/chassis-map: the look of the map from the artboard kit (DEC-96), on the web's colour tokens. */
.chassis-map {
  display: grid;
  justify-items: center;
  gap: 10px;
}
svg.chassis {
  width: 100%;
  max-width: 300px;
  height: auto;
  overflow: visible;
  font-family: var(--font, system-ui, -apple-system, 'Segoe UI', sans-serif);
}
.chassis .m-front {
  font-size: 9px;
  font-weight: 700;
  fill: var(--text-subtle, #6b7280);
  text-anchor: middle;
  letter-spacing: 0.12em;
}
.chassis .m-rail {
  fill: #9fb3bb;
}
.chassis .m-cross {
  fill: #b9c8ce;
}
.chassis .m-bumper {
  fill: #8ea4ad;
}
.chassis .m-axle {
  fill: #7d939c;
}
.chassis .m-hubcap {
  fill: #fff;
  stroke: #7d939c;
  stroke-width: 2;
}
.chassis .m-pin {
  fill: #fff;
  stroke: var(--petrol, #1f4e5f);
  stroke-width: 3;
}
.chassis .m-fifth {
  fill: rgba(31, 78, 95, 0.08);
  stroke: var(--petrol, #1f4e5f);
  stroke-width: 2;
}
.chassis .m-fifth-slot {
  stroke: var(--petrol, #1f4e5f);
  stroke-width: 3;
  stroke-linecap: round;
}
.chassis .m-role {
  font-size: 9px;
  font-weight: 700;
  fill: var(--text-subtle, #6b7280);
}
.chassis .m-tyre rect,
.chassis .m-tyre circle {
  stroke-width: 2.5;
}
.chassis .m-code {
  font-size: 9.5px;
  dominant-baseline: central;
  font-weight: 800;
  text-anchor: middle;
}

/* Statuses (REQ-PLC-008): only the colour, and a dashed outline for Act now and Empty (NFR-10); the guide and the title name them. */
.chassis .t-ok rect,
.chassis .t-ok circle {
  fill: var(--success-bg, #dcfce7);
  stroke: var(--success, #15803d);
}
.chassis .t-ok .m-code {
  fill: var(--success-text, #14532d);
}
.chassis .t-due rect,
.chassis .t-due circle {
  fill: var(--warning-bg, #fef3c7);
  stroke: var(--warning, #b45309);
}
.chassis .t-due .m-code {
  fill: var(--warning-text, #78350f);
}
.chassis .t-act rect,
.chassis .t-act circle {
  fill: var(--danger-bg, #fee2e2);
  stroke: var(--danger, #b91c1c);
  stroke-dasharray: 5 3;
}
.chassis .t-act .m-code {
  fill: var(--danger-text, #7f1d1d);
}
.chassis .t-empty rect,
.chassis .t-empty circle {
  fill: #fff;
  stroke: var(--border-strong, #9ca3af);
  stroke-dasharray: 4 3;
}
.chassis .t-empty .m-code {
  fill: var(--text-subtle, #6b7280);
}
/* DEC-119: Missing is grey with a solid dark outline. */
.chassis .t-miss rect,
.chassis .t-miss circle {
  fill: #e3e9ec;
  stroke: #4a5a61;
}
.chassis .t-miss .m-code {
  fill: #2e3a40;
}
.chassis .t-sel rect,
.chassis .t-sel circle {
  stroke: var(--brand-red, #ad2713);
  stroke-width: 3.5;
}
.chassis .t-sel .m-code {
  fill: var(--brand-red, #ad2713);
}
.chassis .m-tyre[role='button'] {
  cursor: pointer;
}
.chassis .m-tyre[role='button']:hover rect,
.chassis .m-tyre[role='button']:hover circle {
  filter: brightness(0.96);
}
.chassis .m-tyre[role='button']:focus-visible {
  outline: 2px solid var(--petrol, #1f4e5f);
  outline-offset: 2px;
}

/* DEC-119: the guide under the map: each tyre colour with its status and what it means. */
.chassis-guide {
  display: grid;
  gap: 6px;
  width: 100%;
  max-width: 360px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 12px;
}
.chassis-guide li {
  display: grid;
  grid-template-columns: 22px 70px 1fr;
  align-items: center;
  gap: 8px;
}
.chassis-guide b {
  font-weight: 700;
}
.chassis-guide li > span:last-child {
  color: var(--text-muted, #4b5563);
}
.chassis-swatch {
  box-sizing: border-box;
  width: 14px;
  height: 22px;
  border: 2px solid;
  border-radius: 6px;
}
.chassis-swatch.t-ok {
  border-color: var(--success, #15803d);
  background: var(--success-bg, #dcfce7);
}
.chassis-swatch.t-due {
  border-color: var(--warning, #b45309);
  background: var(--warning-bg, #fef3c7);
}
.chassis-swatch.t-act {
  border-color: var(--danger, #b91c1c);
  border-style: dashed;
  background: var(--danger-bg, #fee2e2);
}
.chassis-swatch.t-empty {
  border-color: var(--border-strong, #9ca3af);
  border-style: dashed;
  background: #fff;
}
.chassis-swatch.t-miss {
  border-color: #4a5a61;
  background: #e3e9ec;
}
</style><rect width="100%" height="100%" fill="#fff"/><text x="150" y="12" class="m-front">FRONT</text><rect class="m-rail" x="116" y="24" width="11" height="378" rx="5"></rect><rect class="m-rail" x="173" y="24" width="11" height="378" rx="5"></rect><rect class="m-cross" x="127" y="34" width="46" height="5" rx="2.5"></rect><rect class="m-cross" x="127" y="80" width="46" height="5" rx="2.5"></rect><rect class="m-cross" x="127" y="126" width="46" height="5" rx="2.5"></rect><rect class="m-cross" x="127" y="172" width="46" height="5" rx="2.5"></rect><rect class="m-cross" x="127" y="218" width="46" height="5" rx="2.5"></rect><rect class="m-cross" x="127" y="264" width="46" height="5" rx="2.5"></rect><rect class="m-cross" x="127" y="310" width="46" height="5" rx="2.5"></rect><rect class="m-cross" x="127" y="356" width="46" height="5" rx="2.5"></rect><rect class="m-bumper" x="90" y="20" width="120" height="9" rx="4.5"></rect><g class="m-axle-group"><rect class="m-axle" x="68" y="66" width="164" height="8" rx="4"></rect><text x="2" y="73" class="m-role">Steer</text></g><g class="m-axle-group"><rect class="m-axle" x="68" y="216" width="164" height="8" rx="4"></rect><text x="2" y="223" class="m-role">Steer</text></g><g class="m-axle-group"><rect class="m-axle" x="68" y="282" width="164" height="8" rx="4"></rect><text x="2" y="289" class="m-role">Steer</text></g><g class="m-axle-group"><rect class="m-axle" x="68" y="348" width="164" height="8" rx="4"></rect><text x="2" y="355" class="m-role">Steer</text></g><g class="m-tyre t-ok" data-code="A1_L"><title>A1_L, Axle 1 left, Normal</title><rect x="50" y="44" width="22" height="52" rx="9"></rect><text x="61" y="70" class="m-code" transform="rotate(-90 61 70)">A1_L</text></g><g class="m-tyre t-due" data-code="A1_R"><title>A1_R, Axle 1 right, Due soon</title><rect x="228" y="44" width="22" height="52" rx="9"></rect><text x="239" y="70" class="m-code" transform="rotate(-90 239 70)">A1_R</text></g><g class="m-tyre t-act" data-code="A2_L"><title>A2_L, Axle 2 left, Act now</title><rect x="50" y="194" width="22" height="52" rx="9"></rect><text x="61" y="220" class="m-code" transform="rotate(-90 61 220)">A2_L</text></g><g class="m-tyre t-empty" data-code="A2_R"><title>A2_R, Axle 2 right, Empty</title><rect x="228" y="194" width="22" height="52" rx="9"></rect><text x="239" y="220" class="m-code" transform="rotate(-90 239 220)">A2_R</text></g><g class="m-tyre t-miss" data-code="A3_L"><title>A3_L, Axle 3 left, Missing</title><rect x="50" y="260" width="22" height="52" rx="9"></rect><text x="61" y="286" class="m-code" transform="rotate(-90 61 286)">A3_L</text></g><g class="m-tyre t-ok" data-code="A3_R"><title>A3_R, Axle 3 right, Normal</title><rect x="228" y="260" width="22" height="52" rx="9"></rect><text x="239" y="286" class="m-code" transform="rotate(-90 239 286)">A3_R</text></g><g class="m-tyre t-due" data-code="A4_L"><title>A4_L, Axle 4 left, Due soon</title><rect x="50" y="326" width="22" height="52" rx="9"></rect><text x="61" y="352" class="m-code" transform="rotate(-90 61 352)">A4_L</text></g><g class="m-tyre t-act" data-code="A4_R"><title>A4_R, Axle 4 right, Act now</title><rect x="228" y="326" width="22" height="52" rx="9"></rect><text x="239" y="352" class="m-code" transform="rotate(-90 239 352)">A4_R</text></g><circle class="m-hubcap" cx="78" cy="70" r="6"></circle><circle class="m-hubcap" cx="222" cy="70" r="6"></circle><circle class="m-hubcap" cx="78" cy="220" r="6"></circle><circle class="m-hubcap" cx="222" cy="220" r="6"></circle><circle class="m-hubcap" cx="78" cy="286" r="6"></circle><circle class="m-hubcap" cx="222" cy="286" r="6"></circle><circle class="m-hubcap" cx="78" cy="352" r="6"></circle><circle class="m-hubcap" cx="222" cy="352" r="6"></circle></svg>