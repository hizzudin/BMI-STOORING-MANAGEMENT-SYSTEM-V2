ct><text x="87" y="546" class="m-code" transform="rotate(-90 87 546)">A3_LI</text></g><g class="m-tyre t-ok" data-code="A3_RI"><title>A3_RI, Axle 3 right inner, Normal</title><rect x="202" y="520" width="22" height="52" rx="9"></rect><text x="213" y="546" class="m-code" transform="rotate(-90 213 546)">A3_RI</text></g><g class="m-tyre t-due" data-code="A3_RO"><title>A3_RO, Axle 3 right outer, Due soon</title><rect x="228" y="520" width="22" height="52" rx="9"></rect><text x="239" y="546" class="m-code" transform="rotate(-90 239 546)">A3_RO</text></g><circle class="m-hubcap" cx="104" cy="330" r="6"></circle><circle class="m-hubcap" cx="196" cy="330" r="6"></circle><circle class="m-hubcap" cx="104" cy="480" r="6"></circle><circle class="m-hubcap" cx="196" cy="480" r="6"></circle><circle class="m-hubcap" cx="104" cy="546" r="6"></circle><circle class="m-hubcap" cx="196" cy="546" r="6"></circle></svg>