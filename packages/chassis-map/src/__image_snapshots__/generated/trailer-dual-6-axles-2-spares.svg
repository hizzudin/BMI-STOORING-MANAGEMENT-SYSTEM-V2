"></path><path class="m-tread" d="M207 731 h12"></path><path class="m-tread" d="M207 761 h12"></path><path class="m-tread" d="M207 767 h12"></path><text x="213" y="744" class="m-code" transform="rotate(-90 213 744)">A6_RI</text></g><g class="m-tyre t-empty" data-code="A6_RO"><title>A6_RO, Axle 6 right outer, Empty</title><rect x="228" y="718" width="22" height="52" rx="9"></rect><path class="m-tread" d="M233 725 h12"></path><path class="m-tread" d="M233 731 h12"></path><path class="m-tread" d="M233 761 h12"></path><path class="m-tread" d="M233 767 h12"></path><text x="239" y="744" class="m-code" transform="rotate(-90 239 744)">A6_RO</text></g><g class="m-tyre t-miss" data-code="SP1"><title>SP1, Spare 1, Missing</title><circle cx="120" cy="194" r="21"></circle><circle class="m-hub" cx="120" cy="194" r="11"></circle><text x="120" y="197" class="m-code">SP1</text><text x="120" y="213" class="m-miss m-miss-small">?</text></g><g class="m-tyre t-ok" data-code="SP2"><title>SP2, Spare 2, Normal</title><circle cx="180" cy="194" r="21"></circle><circle class="m-hub" cx="180" cy="194" r="11"></circle><text x="180" y="197" class="m-code">SP2</text></g><circle class="m-hubcap" cx="104" cy="330" r="6"></circle><circle class="m-hubcap" cx="196" cy="330" r="6"></circle><circle class="m-hubcap" cx="104" cy="480" r="6"></circle><circle class="m-hubcap" cx="196" cy="480" r="6"></circle><circle class="m-hubcap" cx="104" cy="546" r="6"></circle><circle class="m-hubcap" cx="196" cy="546" r="6"></circle><circle class="m-hubcap" cx="104" cy="612" r="6"></circle><circle class="m-hubcap" cx="196" cy="612" r="6"></circle><circle class="m-hubcap" cx="104" cy="678" r="6"></circle><circle class="m-hubcap" cx="196" cy="678" r="6"></circle><circle class="m-hubcap" cx="104" cy="744" r="6"></circle><circle class="m-hubcap" cx="196" cy="744" r="6"></circle></svg>